<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Ad - OLX Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#002f34', secondary: '#3a77ff' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-3xl font-bold text-primary tracking-tighter">OLX<span class="text-secondary">Clone</span></a>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-name" class="text-sm font-medium text-gray-700"></span>
                    <a href="#" id="logout-btn" class="text-sm text-gray-500 hover:text-red-500">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Post Ad Form -->
    <main class="max-w-3xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Post Your Ad</h1>
        
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 sm:p-8">
            <form id="post-ad-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ad Title *</label>
                    <input type="text" id="title" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-secondary focus:border-secondary">
                    <p class="mt-1 text-xs text-gray-500">Mention the key features of your item (e.g. brand, model, age, type)</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Description *</label>
                    <textarea id="description" rows="4" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-secondary focus:border-secondary"></textarea>
                    <p class="mt-1 text-xs text-gray-500">Include condition, features and reason for selling</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Category *</label>
                        <select id="category" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-secondary focus:border-secondary bg-white">
                            <option value="">Select Category</option>
                            <option value="Cars">Cars</option>
                            <option value="Motorcycles">Motorcycles</option>
                            <option value="Mobile Phones">Mobile Phones</option>
                            <option value="Properties">Properties</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Furniture">Furniture</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Price ($) *</label>
                        <input type="number" id="price" required min="0" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-secondary focus:border-secondary">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Location *</label>
                    <input type="text" id="location" required placeholder="e.g. New York, NY" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-secondary focus:border-secondary">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Upload Photo</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
                        <div class="space-y-1 text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="image" class="relative cursor-pointer bg-white rounded-md font-medium text-secondary hover:text-blue-500 focus-within:outline-none">
                                    <span>Upload a file</span>
                                    <input id="image" name="image" type="file" accept="image/*" class="sr-only">
                                </label>
                            </div>
                            <p class="text-xs text-gray-500">PNG, JPG, GIF up to 5MB</p>
                            <p id="file-name" class="text-sm font-medium text-primary mt-2"></p>
                        </div>
                    </div>
                </div>

                <div id="error-msg" class="hidden text-red-500 text-sm"></div>

                <div class="pt-5">
                    <button type="submit" id="submit-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                        Post now
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }

            const imageInput = document.getElementById('image');
            const fileNameDisplay = document.getElementById('file-name');
            
            imageInput.addEventListener('change', () => {
                if(imageInput.files.length > 0) {
                    fileNameDisplay.textContent = imageInput.files[0].name;
                }
            });

            const form = document.getElementById('post-ad-form');
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = 'Posting...';
                
                const formData = new FormData();
                formData.append('title', document.getElementById('title').value);
                formData.append('description', document.getElementById('description').value);
                formData.append('category', document.getElementById('category').value);
                formData.append('price', document.getElementById('price').value);
                formData.append('location', document.getElementById('location').value);
                
                if (imageInput.files[0]) {
                    formData.append('image', imageInput.files[0]);
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/products`, {
                        method: 'POST',
                        headers: {
                            'x-auth-token': getToken()
                        },
                        body: formData
                    });

                    if (response.ok) {
                        window.location.href = 'index.html';
                    } else {
                        const data = await response.json();
                        errorMsg.textContent = data.message || 'Failed to post ad';
                        errorMsg.classList.remove('hidden');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Post now';
                    }
                } catch (err) {
                    errorMsg.textContent = 'Network error. Please try again.';
                    errorMsg.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Post now';
                }
            });
        });
    </script>
</body>
</html>
